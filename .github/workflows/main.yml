name: Build ShadowHook Library

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '13114758'
        packages: 'platforms;android-36 build-tools;36.0.0'

    - name: Install NDK and CMake
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --install "ndk;23.2.8568313" "cmake;4.0.3"
        echo "NDK_HOME=$ANDROID_HOME/ndk/23.2.8568313" >> $GITHUB_ENV
        echo "CMAKE_HOME=$ANDROID_HOME/cmake/4.0.3" >> $GITHUB_ENV

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build ShadowHook (Release)
      run: |
        ./gradlew :shadowhook:assembleRelease \
          -Pandroid.injected.signing.store.file="" \
          -Pandroid.injected.signing.store.password="" \
          -Pandroid.injected.signing.key.alias="" \
          -Pandroid.injected.signing.key.password=""
      env:
        ANDROID_NDK_HOME: ${{ env.NDK_HOME }}

    - name: Locate built .so files
      id: find_so
      run: |
        echo "Searching for libshadowhook.so..."
        find . -name "libshadowhook.so" -type f | while read file; do
          echo "Found: $file"
        done
        # نسخ الملفات إلى مجلد موحد للرفع
        mkdir -p artifacts/arm64-v8a artifacts/armeabi-v7a
        cp shadowhook/build/intermediates/cmake/release/obj/arm64-v8a/libshadowhook.so artifacts/arm64-v8a/ 2>/dev/null || true
        cp shadowhook/build/intermediates/cmake/release/obj/armeabi-v7a/libshadowhook.so artifacts/armeabi-v7a/ 2>/dev/null || true
        echo "artifact_path=artifacts" >> $GITHUB_OUTPUT

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: shadowhook-libs
        path: ${{ steps.find_so.outputs.artifact_path }}
        if-no-files-found: warn
