name: Build ShadowHook Library

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '13114758'
        packages: 'platforms;android-36 build-tools;36.0.0'

    - name: Install NDK and CMake
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --install "ndk;23.2.8568313" "cmake;4.0.3"
        echo "NDK_HOME=$ANDROID_HOME/ndk/23.2.8568313" >> $GITHUB_ENV
        echo "CMAKE_HOME=$ANDROID_HOME/cmake/4.0.3" >> $GITHUB_ENV

    - name: Build ShadowHook (Static)
      run: |
        mkdir -p build_static
        cd build_static
        $CMAKE_HOME/bin/cmake \
          -DCMAKE_TOOLCHAIN_FILE=$NDK_HOME/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-21 \
          -DSHADOWHOOK_STATIC=ON \
          -DCMAKE_BUILD_TYPE=Release \
          $GITHUB_WORKSPACE/shadowhook/src/main/cpp
        $CMAKE_HOME/bin/cmake --build . --target shadowhook -j$(nproc)
      env:
        ANDROID_NDK_HOME: ${{ env.NDK_HOME }}

    - name: Locate built files
      id: find_files
      run: |
        echo "Searching for libshadowhook.a..."
        find . -name "libshadowhook.a" -type f | while read file; do
          echo "Found: $file"
        done
        mkdir -p artifacts/arm64-v8a
        cp build_static/libshadowhook.a artifacts/arm64-v8a/ 2>/dev/null || true
        cp shadowhook/src/main/cpp/include/shadowhook.h artifacts/ 2>/dev/null || true
        echo "artifact_path=artifacts" >> $GITHUB_OUTPUT

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: shadowhook-libs
        path: ${{ steps.find_files.outputs.artifact_path }}
        if-no-files-found: warn
